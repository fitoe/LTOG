name: cd

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish installer
    runs-on: windows-latest

    steps:
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag must look like v1.0.0 or v1.0.0.0. Got '$tag'."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up native toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make autoconf automake libtool
            mingw-w64-x86_64-gcc mingw-w64-x86_64-tools
            mingw-w64-x86_64-libxml2 mingw-w64-x86_64-icu
            mingw-w64-x86_64-pkgconf

      - name: Install WinFsp build runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest $url -OutFile $msi
          if ((Get-FileHash $msi).Hash -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') {
            throw 'WinFsp checksum mismatch'
          }
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -notin @(0, 3010)) { throw "WinFsp install failed: $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Version $env:RELEASE_VERSION -MsysRoot $env:MSYS_ROOT

      - name: Test identity client
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Test native identity attributes
        shell: msys2 {0}
        run: bash tests/native_identity.sh

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\installer\Output -Filter "LTOG-$env:RELEASE_VERSION-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Installer not found in installer\Output."
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG "${{ steps.installer.outputs.path }}" `
            --target "${{ github.sha }}" `
            --title "LTOG $env:RELEASE_VERSION" `
            --notes "Installer build for LTOG $env:RELEASE_VERSION." `
            --latest
