name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-gui:
    name: Build GUI
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ hashFiles('gui/LTOG.Gui.csproj') }}
          restore-keys: nuget-

      - name: Build GUI
        working-directory: gui
        run: dotnet build LTOG.Gui.csproj -c Release -p:Platform=x64 --nologo
